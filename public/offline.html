<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Çevrimdışı Mod - Beşiktaş Fikstür</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0a0a0a;
      color: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .offline-card {
      max-width: 480px;
      width: 100%;
      background: #171717;
      border: 1px solid #262626;
      border-radius: 20px;
      padding: 40px 28px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .icon-container {
      width: 80px;
      height: 80px;
      background: #262626;
      color: #ef4444;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    .icon-container svg {
      width: 42px;
      height: 42px;
      stroke: currentColor;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: #a3a3a3;
      margin-bottom: 28px;
    }
    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px 20px;
      background: #e11d48;
      color: #ffffff;
      font-weight: 600;
      font-size: 15px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.1s ease;
      margin-bottom: 12px;
    }
    .btn-retry:hover {
      background: #be123c;
    }
    .btn-retry:active {
      transform: scale(0.98);
    }
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px 20px;
      background: #262626;
      color: #e5e5e5;
      font-weight: 600;
      font-size: 14px;
      border-radius: 12px;
      text-decoration: none;
      transition: background 0.2s ease;
    }
    .btn-secondary:hover {
      background: #404040;
    }
    .offline-links {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #262626;
      display: flex;
      justify-content: center;
      gap: 16px;
    }
    .offline-links a {
      color: #ef4444;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
    }
    .offline-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="icon-container">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>İnternet Bağlantısı Yok</h1>
    <p>
      Şu an çevrimdışısınız. Daha önce yüklenen Beşiktaş maç takvimi ve puan tablosuna cihazınızın hafızasından erişebilirsiniz.
    </p>
    <button class="btn-retry" onclick="window.location.reload()">
      Yeniden Bağlanmayı Dene
    </button>
    <a href="/" class="btn-secondary">
      Kayıtlı Fikstürü Görüntüle
    </a>
    <div class="offline-links">
      <a href="/">Ana Sayfa</a>
      <a href="/hakkinda">Hakkında</a>
    </div>
  </div>
</body>
</html>
